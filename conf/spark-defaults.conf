# Spark reads this file automatically when it starts (it is mounted into the container
# at /opt/spark/conf/spark-defaults.conf by docker-compose.yml).
# Settings here apply BEFORE our Python code runs, which is required for add-ons (packages).

#give spark 2GB so we can write delta tables without worry
spark.driver.memory               2g
# Add-ons downloaded on the first run, then cached: the Kafka connector and Delta Lake
spark.jars.packages               org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,io.delta:delta-spark_2.12:3.2.0
spark.jars.ivy                    /tmp/.ivy2

# Turn on Delta Lake support
spark.sql.extensions              io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog   org.apache.spark.sql.delta.catalog.DeltaCatalog

# Small data, so few tasks for shuffles (default is 200)
spark.sql.shuffle.partitions      4
