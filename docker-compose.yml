services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka-data:/var/lib/kafka/data

  # Spark: runs our pipeline scripts (bronze, silver, gold).
  # Java + Spark + Python are already inside the image, nothing to install on Windows.
  spark:
    image: spark:3.5.3-python3            # official Spark image, with Python
    container_name: spark
    user: root                            # avoids file-permission problems on the shared folder
    working_dir: /app
    volumes:
      - ./:/app                           # our project folder, shared into the container
      - spark-ivy:/tmp/.ivy2              # cache for downloaded Spark add-ons (Kafka + Delta)
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf   # Spark's startup settings
    depends_on:
      - kafka
    command: ["sleep", "infinity"]        # keep the container alive; we run scripts with "exec"

volumes:
  kafka-data:
  spark-ivy: